<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>VitaFit Gym - Registration</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Segoe UI,sans-serif;
}

body{
    background:#111;
    color:white;
    display:flex;
    justify-content:center;
    align-items:center;
    min-height:100vh;
}

.container{
    width:90%;
    max-width:900px;
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:20px;
}

.box{
    background:#1e1e1e;
    padding:30px;
    border-radius:10px;
}

h2{
    color:#ff4500;
    margin-bottom:20px;
    text-align:center;
}

input{
    width:100%;
    padding:12px;
    margin:10px 0;
    border:none;
    border-radius:5px;
}

button{
    width:100%;
    padding:12px;
    background:#ff4500;
    color:white;
    border:none;
    border-radius:5px;
    cursor:pointer;
    margin-top:10px;
}

button:hover{
    background:#ff6a33;
}

.back{
    position:absolute;
    top:20px;
    left:20px;
    color:white;
    text-decoration:none;
    background:#ff4500;
    padding:10px 15px;
    border-radius:5px;
}

@media(max-width:768px){
.container{
grid-template-columns:1fr;
}
}
</style>
</head>
<body>

<a href="index.html" class="back">← Back</a>

<div class="container">

<div class="box">
<h2>Sign Up</h2>

<form>
<input type="text" placeholder="Full Name" required>
<input type="email" placeholder="Email Address" required>
<input type="tel" placeholder="Phone Number" required>
<input type="password" placeholder="Password" required>

<button type="submit">Create Account</button>
</form>
</div>

<div class="box">
<h2>Login</h2>

<form>
<input type="email" placeholder="Email Address" required>
<input type="password" placeholder="Password" required>

<button type="submit">Login</button>
</form>
</div>

</div>

</body>
</html>
